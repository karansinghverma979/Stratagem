name: Showcase Sentry

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  close-pr:
    name: Showcase Notice & Auto-Close
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge and Close Incoming PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const message = [
              '### ♟️ Stratagem — Feature-Complete Showcase Notice',
              '',
              'Thank you for your interest in **Stratagem**!',
              '',
              'This repository is maintained strictly as an immutable **Feature-Complete Flagship Showcase** and architectural reference. Active development has concluded, and we do not accept external pull requests or unsolicited code modifications.',
              '',
              'You are warmly encouraged to **fork this repository** under the [MIT License](https://github.com/karansinghverma979/Stratagem/blob/main/LICENSE) to build your own personal variations, customizations, and experiments.',
              '',
              'This pull request will now be automatically closed. ♟️'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed'
            });
